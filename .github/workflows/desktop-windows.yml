name: Windows desktop package

on:
  workflow_call:
    inputs:
      retention-days:
        type: number
        default: 7
      candidate:
        description: Run archive acceptance and retain release-candidate evidence
        type: boolean
        default: false
      inference-acceptance:
        description: Download pinned models and validate both inference profiles for candidates
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    name: Build and test Windows x64 ZIP
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      VCPKG_DISABLE_METRICS: "1"
      VCPKG_MAX_CONCURRENCY: "2"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned vcpkg baseline
        id: baseline
        shell: pwsh
        run: |
          $baseline = (Get-Content packaging/windows-ocr/vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          "revision=$baseline" >> $env:GITHUB_OUTPUT
      - name: Checkout Windows OCR build toolchain
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.baseline.outputs.revision }}
          path: build/vcpkg
      - uses: ./.github/actions/setup-desktop
        id: setup
      - name: Restore compiled OCR dependencies
        id: ocr-cache
        uses: actions/cache/restore@v4
        with:
          path: build/vcpkg-cache
          key: windows-2022-x64-static-ocr-v1-${{ hashFiles('packaging/windows-ocr/**') }}-${{ steps.setup.outputs.image-version }}
      - name: Restore pinned vcpkg source and tool downloads
        id: downloads
        uses: actions/cache/restore@v4
        with:
          path: build/vcpkg/downloads
          key: windows-${{ runner.arch }}-vcpkg-downloads-v1-${{ steps.baseline.outputs.revision }}
      - name: Configure private binary cache
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/vcpkg-cache | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,$((Resolve-Path build/vcpkg-cache).Path),readwrite" >> $env:GITHUB_ENV
      - name: Bootstrap pinned vcpkg
        shell: cmd
        run: build\vcpkg\bootstrap-vcpkg.bat -disableMetrics
      - name: Build portable archive with private OCR
        env:
          LENS_BUILD_LOG: ${{ inputs.candidate && 'build/candidate-build.log' || 'build/desktop-ci-build.log' }}
        shell: pwsh
        run: |
          uv run --no-sync python packaging/build_windows.py --vcpkg-root build/vcpkg --tessdata-dir build/tessdata 2>&1 | Tee-Object $env:LENS_BUILD_LOG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save compiled OCR dependencies even if packaging failed
        if: ${{ !cancelled() && steps.ocr-cache.outputs.cache-hit != 'true' && hashFiles('build/windows-ocr-installed/lens-x64-windows-static/tools/tesseract/tesseract.exe') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: build/vcpkg-cache
          key: ${{ steps.ocr-cache.outputs.cache-primary-key }}
      - name: Save completed vcpkg source and tool downloads
        if: ${{ !cancelled() && steps.downloads.outputs.cache-hit != 'true' && hashFiles('build/windows-ocr-installed/lens-x64-windows-static/tools/tesseract/tesseract.exe') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: build/vcpkg/downloads
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      - name: Smoke test extracted package without model downloads
        if: ${{ !inputs.candidate }}
        run: uv run --no-sync python packaging/ci_smoke.py dist/RealOpenLens-windows-x64.zip
      - name: Validate the exact candidate archive
        if: inputs.candidate
        uses: ./.github/actions/desktop-acceptance
        with:
          archive: dist/RealOpenLens-windows-x64.zip
          inference: ${{ inputs.inference-acceptance }}
      - name: Retain portable archive and checksum
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.candidate && 'desktop-candidate-windows-x64' || 'desktop-windows-x64' }}-${{ github.sha }}
          path: |
            dist/RealOpenLens-windows-x64.zip
            dist/RealOpenLens-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.candidate && 'desktop-candidate-windows-evidence' || 'desktop-windows-evidence' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/desktop-ci-*.log
            build/desktop-ci-report.json
            build/candidate-build.log
            build/candidate-models.log
            build/candidate-acceptance/
            build/windows-ocr-installed/vcpkg/status
            build/vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore
          retention-days: ${{ inputs.retention-days }}
