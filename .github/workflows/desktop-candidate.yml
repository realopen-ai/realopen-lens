name: Desktop release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    uses: ./.github/workflows/desktop-windows.yml
    with:
      retention-days: 30
      candidate: true

  macos:
    uses: ./.github/workflows/desktop-macos.yml
    with:
      retention-days: 30
      candidate: true
