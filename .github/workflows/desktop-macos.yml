name: macOS desktop package

on:
  workflow_call:
    inputs:
      retention-days:
        type: number
        default: 7
      candidate:
        description: Run archive acceptance and retain release-candidate evidence
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  macos:
    name: Build and test macOS arm64 ZIP
    runs-on: macos-15
    timeout-minutes: ${{ inputs.candidate && 35 || 30 }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.5"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv python install 3.12
      - run: uv sync --locked --python 3.12 --extra web --group packaging --no-editable
      - run: uv run --no-sync python -c "import tkinter; print(tkinter.Tcl().eval('info patchlevel'))"
      - run: npm --prefix frontend ci
      - name: Build ad-hoc signed archive with private OCR
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          LENS_BUILD_LOG: ${{ inputs.candidate && 'build/candidate-build.log' || 'build/desktop-ci-build.log' }}
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          brew list tesseract >/dev/null 2>&1 || brew install tesseract
          uv run --no-sync python packaging/build_macos.py 2>&1 | tee "$LENS_BUILD_LOG"
      - name: Smoke test extracted package without model downloads
        if: ${{ !inputs.candidate }}
        run: uv run --no-sync python packaging/ci_smoke.py dist/RealOpenLens-macos-arm64.zip
      - name: Validate the exact candidate archive
        if: inputs.candidate
        run: uv run --no-sync python packaging/acceptance.py dist/RealOpenLens-macos-arm64.zip --output build/candidate-acceptance
      - name: Retain archive and checksum
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.candidate && 'desktop-candidate-macos-arm64' || 'desktop-macos-arm64' }}-${{ github.sha }}
          path: |
            dist/RealOpenLens-macos-arm64.zip
            dist/RealOpenLens-macos-arm64.zip.sha256
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.candidate && 'desktop-candidate-evidence' || 'desktop-macos-diagnostics' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/desktop-ci-*.log
            build/desktop-ci-report.json
            build/candidate-build.log
            build/candidate-acceptance/
          if-no-files-found: ignore
          retention-days: ${{ inputs.retention-days }}
