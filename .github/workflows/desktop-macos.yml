name: macOS desktop package

on:
  workflow_call:
    inputs:
      retention-days:
        type: number
        default: 7
      candidate:
        description: Run archive acceptance and retain release-candidate evidence
        type: boolean
        default: false
      inference-acceptance:
        description: Download pinned models and validate both inference profiles for candidates
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  macos:
    name: Build and test macOS arm64 ZIP
    runs-on: macos-15
    timeout-minutes: ${{ inputs.inference-acceptance && 90 || inputs.candidate && 35 || 30 }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-desktop
        id: setup
      - name: Check build-time OCR installation
        id: brew
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          if brew list tesseract >/dev/null 2>&1; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "installed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore Homebrew downloads when installation is needed
        if: steps.brew.outputs.installed != 'true'
        id: brew-cache
        uses: actions/cache/restore@v4
        with:
          path: build/homebrew-cache
          key: macos-15-${{ runner.arch }}-homebrew-tesseract-v1-${{ steps.setup.outputs.image-version }}
      - name: Install build-time OCR
        if: steps.brew.outputs.installed != 'true'
        id: brew-install
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_CACHE: ${{ github.workspace }}/build/homebrew-cache
        run: brew install tesseract
      - name: Save Homebrew downloads
        if: ${{ !cancelled() && steps.brew-install.outcome == 'success' && steps.brew-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: build/homebrew-cache
          key: ${{ steps.brew-cache.outputs.cache-primary-key }}
      - name: Build ad-hoc signed archive with private OCR
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          LENS_BUILD_LOG: ${{ inputs.candidate && 'build/candidate-build.log' || 'build/desktop-ci-build.log' }}
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          uv run --no-sync python packaging/build_macos.py --tessdata-dir build/tessdata 2>&1 | tee "$LENS_BUILD_LOG"
      - name: Smoke test extracted package without model downloads
        if: ${{ !inputs.candidate }}
        run: uv run --no-sync python packaging/ci_smoke.py dist/RealOpenLens-macos-arm64.zip
      - name: Validate the exact candidate archive
        if: inputs.candidate
        uses: ./.github/actions/desktop-acceptance
        with:
          archive: dist/RealOpenLens-macos-arm64.zip
          inference: ${{ inputs.inference-acceptance }}
      - name: Retain archive and checksum
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.candidate && 'desktop-candidate-macos-arm64' || 'desktop-macos-arm64' }}-${{ github.sha }}
          path: |
            dist/RealOpenLens-macos-arm64.zip
            dist/RealOpenLens-macos-arm64.zip.sha256
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.candidate && 'desktop-candidate-macos-evidence' || 'desktop-macos-evidence' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/desktop-ci-*.log
            build/desktop-ci-report.json
            build/candidate-build.log
            build/candidate-models.log
            build/candidate-acceptance/
          if-no-files-found: ignore
          retention-days: ${{ inputs.retention-days }}
