name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.5"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --python 3.12
      - run: uv run --no-sync black --check .
      - run: uv run --no-sync flake8 --config tox.ini src tests benchmarks
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy src benchmarks
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync lens --help
      - run: uv run --no-sync python -m benchmarks --help
