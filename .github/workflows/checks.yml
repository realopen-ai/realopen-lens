name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.5"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --python 3.12 --extra web
      - run: uv run --no-sync black --check .
      - run: uv run --no-sync flake8 --config tox.ini src tests benchmarks
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy src benchmarks
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync lens --help
      - run: uv run --no-sync python -m benchmarks --help

  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test
        working-directory: frontend
