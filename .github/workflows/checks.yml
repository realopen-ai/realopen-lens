name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.5"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --python 3.12 --extra web
      - run: uv run --no-sync black --check .
      - run: uv run --no-sync flake8 --config tox.ini src tests benchmarks
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy src benchmarks
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync lens --help
      - run: uv run --no-sync python -m benchmarks --help

  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  desktop-macos:
    name: Desktop package (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.5"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv python install 3.12
      - run: uv sync --locked --python 3.12 --extra web --group packaging --no-editable
      - run: uv run --no-sync python -c "import tkinter; print(tkinter.Tcl().eval('info patchlevel'))"
      - run: npm ci
        working-directory: frontend
      - name: Build development archive
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        shell: bash
        run: |
          mkdir -p build
          brew list tesseract >/dev/null 2>&1 || brew install tesseract
          uv run --no-sync python packaging/build_macos.py 2>&1 | tee build/desktop-ci-build.log
      - name: Smoke test extracted package without model downloads
        run: uv run --no-sync python packaging/ci_smoke.py dist/RealOpenLens-macos-arm64.zip
      - name: Upload development archive
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-arm64-${{ github.sha }}
          path: dist/RealOpenLens-macos-arm64.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/desktop-ci-*.log
            build/desktop-ci-report.json
          if-no-files-found: ignore
          retention-days: 7
