name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      desktop: ${{ steps.filter.outputs.desktop }}
      gallery: ${{ steps.filter.outputs.gallery }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Pushes compare with the pre-push revision of this branch. PR events
          # use the complete PR diff through the action's paginated API lookup.
          base: ${{ github.ref }}
          filters: |
            python:
              - '**/*.py'
              - 'src/**'
              - 'tests/**'
              - 'benchmarks/**'
              - 'packaging/**'
              - 'configs/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'uv.toml'
              - '.python-version'
              - 'tox.ini'
              - 'setup.cfg'
              - 'pytest.ini'
              - '.flake8'
              - 'ruff.toml'
              - '.ruff.toml'
              - 'mypy.ini'
              - '.mypy.ini'
              - 'LICENSE'
              - 'THIRD_PARTY_NOTICES.md'
              - '.gitignore'
              - '.gitattributes'
              - '.github/workflows/checks.yml'
            desktop:
              - 'src/**'
              - 'frontend/**'
              - 'packaging/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'uv.toml'
              - '.python-version'
              - 'LICENSE'
              - 'THIRD_PARTY_NOTICES.md'
              - '.gitignore'
              - '.gitattributes'
              - '.github/workflows/checks.yml'
              - '.github/workflows/desktop-candidate.yml'
            gallery:
              - 'frontend/**'
              - 'src/realopen_lens/api/**'
              - '.gitattributes'
              - '.github/workflows/checks.yml'

  checks:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.5"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --python 3.12 --extra web
      - run: uv run --no-sync black --check .
      - run: uv run --no-sync flake8 --config tox.ini src tests benchmarks
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy src benchmarks
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync lens --help
      - run: uv run --no-sync python -m benchmarks --help

  gallery:
    needs: changes
    if: needs.changes.outputs.gallery == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  desktop-macos:
    name: Desktop package (macOS arm64)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.5"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv python install 3.12
      - run: uv sync --locked --python 3.12 --extra web --group packaging --no-editable
      - run: uv run --no-sync python -c "import tkinter; print(tkinter.Tcl().eval('info patchlevel'))"
      - run: npm ci
        working-directory: frontend
      - name: Build development archive
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        shell: bash
        run: |
          mkdir -p build
          brew list tesseract >/dev/null 2>&1 || brew install tesseract
          uv run --no-sync python packaging/build_macos.py 2>&1 | tee build/desktop-ci-build.log
      - name: Smoke test extracted package without model downloads
        run: uv run --no-sync python packaging/ci_smoke.py dist/RealOpenLens-macos-arm64.zip
      - name: Upload development archive
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-arm64-${{ github.sha }}
          path: dist/RealOpenLens-macos-arm64.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/desktop-ci-*.log
            build/desktop-ci-report.json
          if-no-files-found: ignore
          retention-days: 7
